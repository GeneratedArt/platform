name: Deploy Jekyll site to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync D1 data to Jekyll (optional - skips if no secrets)
        run: node scripts/sync-d1-to-jekyll.mjs site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.c016d64a9a4f4a2900fb3385bd08144f }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.cfut_aChQEkqL6xQ9mrNq54d89kHSjHdJGD8lCKwkf6PC0c307700 }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Build Jekyll site
        working-directory: ./site
        run: bundle exec jekyll build --destination "/home/runner/work/platform/platform/_site"
        env:
          JEKYLL_ENV: production

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.c016d64a9a4f4a2900fb3385bd08144f }}
          accountId: ${{ secrets.cfut_aChQEkqL6xQ9mrNq54d89kHSjHdJGD8lCKwkf6PC0c307700 }}
          command: pages deploy _site --project-name=generatedart-website --branch=main
