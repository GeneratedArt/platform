name: Deploy API Worker

# Builds and deploys the dynamic API worker (workers/api/) — Hono + D1 + KV +
# R2 + Queues. This is the worker that serves /v1/*, /me, /auth/*, etc. as
# specified in §6 of the spec.
#
# Lives at:
#   • dev:        https://generatedart-api.guillaumelauzier.workers.dev
#   • production: https://api.generatedart.com (after `--env production`
#     route attaches; routes block is in workers/api/wrangler.toml)
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with "Workers Scripts:Edit" + "D1:Edit"
#   CLOUDFLARE_ACCOUNT_ID  — numeric account id
#
# This intentionally lives in a separate workflow from pages.yml (the static
# site) so a broken Jekyll build never blocks an API hotfix and vice versa.

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
      - "workers/shared/**"
      - ".github/workflows/worker-api.yml"
  pull_request:
    paths:
      - "workers/api/**"
      - "workers/shared/**"
      - ".github/workflows/worker-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API worker deps
        working-directory: workers/api
        # Foundation phase: no package-lock.json yet. Switch to `npm ci` (and
        # restore the cache + cache-dependency-path block above) once a lock
        # file is committed.
        run: npm install --no-audit --no-fund

      - name: Detect D1 migrations
        id: detect_migrations
        run: |
          if [ -d workers/api/migrations ] && [ -n "$(ls -A workers/api/migrations 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations (idempotent)
        if: |
          steps.detect_migrations.outputs.present == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply generatedart --remote

      - name: Deploy worker
        # On main → production (binds api.generatedart.com once DNS is set).
        # On PR  → preview script (separate name, isolates blast radius).
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx wrangler deploy --name "generatedart-api-pr-${{ github.event.number }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx wrangler deploy --env production
          else
            npx wrangler deploy
          fi
