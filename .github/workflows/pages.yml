name: Deploy Jekyll site to GitHub Pages

# Single source of truth for static-site deployment.
# Builds the Snowflake-based Jekyll site at the repo root and publishes to
# GitHub Pages. CNAME (generatedart.com) is committed at the repo root and
# preserved in the build artifact.
#
# Repo setting required (one-time, manual):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    branches: [main]
    # Only fire when something the static site cares about changed.
    paths-ignore:
      - "workers/**"
      - "contracts/**"
      - ".github/workflows/worker-api.yml"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, queue subsequent runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
