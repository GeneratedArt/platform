<!-- Global notifications bell (Task #17). ga-auth exposes window.GAAuth used by
     the bell to gate display on signed-in viewers; ga-feed mounts the bell into
     the existing nav-10 partial. apiBase resolution mirrors the per-page bundles:
     ?api= override > localhost dev > production. -->
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var apiBase = params.get("api") || (location.hostname === "localhost" || location.hostname === "127.0.0.1"
      ? "http://" + location.hostname + ":8787"
      : "https://api.generatedart.com");
    document.body.dataset.gaApiBase = apiBase;
  })();
</script>
