title: "GeneratedArt"
description: >-
  Community-run generative art platform and NFT marketplace for code-based
  generative art (p5.js, three.js, WebGL, GLSL). A spiritual successor to
  fxhash and Art Blocks, with a physical-digital bridge through the Geneva
  gallery.
url: "https://generatedart.com"
baseurl: ""
permalink: "/:title"

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-archives

# Files and directories Jekyll must NOT process.
# Workers, contracts and CI live alongside the Jekyll source in this monorepo.
exclude:
  - workers
  - contracts
  - node_modules
  - .github
  - .agents
  - .local
  - .config
  - .cache
  - .wrangler
  - .git.broken
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - replit.md
  - AUDIT.md
  - attached_assets
  - .verify-deploy
  # Audit F-09 fix: exclude unbranded template demo carcasses from being routable
  # on generatedart.com. They render Lorem-ipsum under the new GA brand and
  # damage SEO + trust if indexed.
  - home-pages
  - elements
  - features
  - services

collections:
  authors:
    output: true
  shop_items:
    output: true
    permalink: /shop/:name
  portfolio:
    output: true
    permalink: /portfolio/:name

# Pagination (jekyll-paginate-v2)
pagination:
  enabled: true
  debug: false
  collection: 'posts'
  per_page: 9
  permalink: '/page/:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  trail:
    before: 2
    after: 2
  extension: html
  indexpage: 'index'

# Archives
jekyll-archives:
  enabled:
    - tags
    - categories
  layouts:
    tag: tag
    category: category
  permalinks:
    tag: '/tag/:name/'
    category: '/category/:name/'

feed:
  collections:
    posts:
      path: "/index.xml"

highlighter: rouge
