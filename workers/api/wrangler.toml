name = "generatedart-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Audit F-13 fix: keep the worker off *.workers.dev so the only public surface
# is the production route on api.generatedart.com.
workers_dev = false

[observability]
enabled = true

# ============================================================================
# Production environment (api.generatedart.com)
# ============================================================================
#
# Audit F-03 fix: the six Cloudflare resource IDs that previously lived in
# [userenv.shared] in .replit are declared here as bindings under
# [env.production]. They are commented out today and uncommented in the task
# that wires the corresponding feature on (Worker SIWE auth, project storage,
# captures, render queue, indexer state).
#
# `wrangler dev` for local Worker development uses .dev.vars (gitignored) for
# any per-developer secrets. There is no .dev.vars committed to the repo.

[env.production]
name = "generatedart-api"
routes = [
  { pattern = "api.generatedart.com/*", zone_name = "generatedart.com" }
]

