name = "generatedart-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Audit F-13 fix: keep the worker off *.workers.dev so the only public surface
# is the production route on api.generatedart.com.
workers_dev = false

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Local development bindings (used by `npx wrangler dev`).
# Miniflare materialises these into a per-developer SQLite DB and KV stores
# under .wrangler/state/, so no real Cloudflare resources are touched until
# you invoke `wrangler deploy --env production`. .dev.vars (gitignored) holds
# JWT_SECRET, COOKIE_DOMAIN, and ALLOWED_ORIGINS for local runs.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "generatedart-dev"
database_id   = "local-dev-d1"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id      = "local-dev-sessions"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id      = "local-dev-rate-limit"

# Local R2 bucket for studio captures (Task #4). Miniflare materialises
# this as ./.wrangler/state/v3/r2/, no real Cloudflare resource is
# created. The production R2 binding lives commented under
# [env.production] below — uncomment when Cloudflare provisions the
# bucket and DNS for assets.generatedart.com.
[[r2_buckets]]
binding     = "CAPTURES"
bucket_name = "generatedart-assets-dev"

# ============================================================================
# Production environment (api.generatedart.com)
# ============================================================================
#
# Audit F-03 fix: the six Cloudflare resource IDs that previously lived in
# [userenv.shared] in .replit are declared here as bindings under
# [env.production]. Task #2 uncomments DB + SESSIONS + RATE_LIMIT; later tasks
# uncomment INDEXER_STATE / CAPTURES / RENDER_QUEUE as they need them.

[env.production]
name = "generatedart-api"
routes = [
  { pattern = "api.generatedart.com/*", zone_name = "generatedart.com" }
]

# --- Project + artist database (Task #2: schema; Task #3: writes) -----------
[[env.production.d1_databases]]
binding        = "DB"
database_name  = "generatedart"
database_id    = "6c83d3f6-b3be-4e8d-9be2-a3274ad24e2a"
migrations_dir = "migrations"

# --- Sessions (SIWE nonce + JWT revoke list) — Task #2 ----------------------
[[env.production.kv_namespaces]]
binding = "SESSIONS"
id      = "4c07b557b1b64e9dbe4b76427328c54a"

# --- Per-IP and per-address rate limit — Task #2 ----------------------------
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id      = "071e1e836716455d9e30fd37389c03fa"

# --- Indexer cursor + last-seen mint state — uncomment with Task #5 ---------
# [[env.production.kv_namespaces]]
# binding = "INDEXER_STATE"
# id      = "20884d2a97504b82822f34b6dc725e02"

# --- Captures + thumbnails — uncomment with Task #4 -------------------------
# [[env.production.r2_buckets]]
# binding     = "CAPTURES"
# bucket_name = "generatedart-assets"

# --- Async render + IPFS pin jobs — uncomment with Task #4 / Task #5 --------
# [[env.production.queues.producers]]
# binding    = "RENDER_QUEUE"
# queue      = "render-jobs"
#
# [[env.production.queues.consumers]]
# queue                = "render-jobs"
# max_batch_size       = 10
# max_batch_timeout    = 5
# max_retries          = 3
# dead_letter_queue    = "render-jobs-dlq"

# --- Production env vars (non-secret). JWT_SECRET is set via:
#       wrangler secret put JWT_SECRET --env production
[env.production.vars]
COOKIE_DOMAIN    = ".generatedart.com"
ALLOWED_ORIGINS  = "https://generatedart.com,https://www.generatedart.com"

# Zone bound at the route level above (zone_name = "generatedart.com").
# CLOUDFLARE_ZONE_ID = "5f16e1194f7d4b9f508b955e49c7c6ad" lives in the
# Cloudflare dashboard for this account; not needed in repo config.
